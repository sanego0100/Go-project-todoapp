services:
  todoapp-pg:
    image: postgres:18
    container_name: todoapp-pg
    environment:
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB}
    restart: unless-stopped    

    volumes:
      - ${PROJECT_ROOT}/out/pgdata:/var/lib/postgresql
  
  todoapp-pg-migrate:
    image: migrate/migrate:v4.20.1
    
    volumes:
      - ${PROJECT_ROOT}/migrations:/migrations
  
  port-forwarder:
    image: alpine/socat:1.8.0.1
    container_name: todoapp-pg-port-forwarder
    command: tcp-listen:5432,fork,reuseaddr tcp-connect:todoapp-pg:5432
    ports:
      - "127.0.0.1:5433:5432" 